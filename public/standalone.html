    <style>
#advisor-full {
  --af-bg: #f4f6fa;
  --af-panel: #fff;
  --af-sub: #edf0f6;
  --af-line: #dce1ec;
  --af-text: #20293c;
  --af-muted: #56647b;
  --af-accent: #5849b8;
  --af-tint: #efecfc;
  --af-good: #17654c;
  --af-warn: #865505;
  --af-pad: 12px;
  color: var(--af-text);
  background: var(--af-bg);
  border: 1px solid var(--af-line);
  border-radius: 12px;
  font:
    13px/1.5 -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  overflow: hidden;
}
#advisor-full * {
  box-sizing: border-box;
}
#advisor-full [hidden] {
  display: none !important;
}
#advisor-full h2,
#advisor-full h3,
#advisor-full p {
  margin: 0;
}
#advisor-full h2 {
  font-size: 23px;
  line-height: 1.35;
  font-weight: 650;
}
#advisor-full h3 {
  font-size: 14px;
  font-weight: 600;
}
#advisor-full button,
#advisor-full input,
#advisor-full select {
  font: inherit;
  color: var(--af-text);
  border: 1px solid var(--af-line);
  border-radius: 6px;
  background: var(--af-panel);
  min-height: 36px;
  padding: 7px 10px;
  max-width: 100%;
}
#advisor-full button:disabled {
  opacity: 0.45;
}
#advisor-full button:hover:not(:disabled) {
  background: var(--af-tint);
}
#advisor-full button[aria-pressed="true"],
#advisor-full .af-chosen {
  background: var(--af-tint);
  color: var(--af-accent);
  border-color: var(--af-accent);
}
#advisor-full .af-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 108px 14px 18px;
  background: var(--af-panel);
  border-bottom: 1px solid var(--af-line);
}
#advisor-full .af-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 650;
  font-size: 14px;
}
#advisor-full .af-lang {
  display: flex;
  gap: 5px;
}
#advisor-full .af-lang button {
  min-width: 48px;
}
#advisor-full .af-shell {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr);
}
#advisor-full aside {
  background: var(--af-panel);
  border-right: 1px solid var(--af-line);
  padding: 14px 10px;
}
#advisor-full .af-section-label {
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--af-muted);
  margin: 14px 8px 7px;
}
#advisor-full .af-nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
#advisor-full .af-nav button {
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  display: flex;
  justify-content: space-between;
  gap: 4px;
  font-size: 12px;
  padding: 9px 8px;
}
#advisor-full .af-nav button[aria-current="page"] {
  background: var(--af-tint);
  color: var(--af-accent);
}
#advisor-full .af-nav small {
  font-size: 11px;
  color: var(--af-muted);
}
#advisor-full .af-content {
  min-width: 0;
  padding: 22px;
}
#advisor-full .af-subtitle {
  font-size: 12px;
  color: var(--af-muted);
  margin-top: 7px;
}
#advisor-full .af-links {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin: 14px 0 18px;
}
#advisor-full a {
  color: var(--af-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
#advisor-full .af-links a {
  font-size: 12px;
  text-decoration: none;
}
#advisor-full .af-group {
  border: 1px solid var(--af-line);
  border-radius: 8px;
  padding: 14px;
  background: var(--af-panel);
  margin-bottom: 12px;
}
#advisor-full .af-group-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
#advisor-full .af-group-title small {
  font-size: 11px;
  color: var(--af-muted);
}
#advisor-full .af-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px 12px;
}
#advisor-full .af-field {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
}
#advisor-full .af-field input,
#advisor-full .af-field select {
  width: 100%;
  background: var(--af-sub);
  min-height: 38px;
}
#advisor-full .af-field small {
  font-size: 11px;
  color: var(--af-muted);
  line-height: 1.45;
}
#advisor-full .af-wide {
  grid-column: span 2;
}
#advisor-full .af-notice {
  padding: 10px 12px;
  border-left: 3px solid var(--af-accent);
  background: var(--af-tint);
  font-size: 12px;
  color: var(--af-text);
  margin: 12px 0;
}
#advisor-full .af-result-title {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin: 22px 0 10px;
}
#advisor-full .af-result-title h3 {
  font-size: 17px;
}
#advisor-full .af-status {
  font-size: 12px;
  color: var(--af-good);
}
#advisor-full .af-summary {
  display: flex;
  gap: 12px 24px;
  flex-wrap: wrap;
  padding: 12px 0;
  color: var(--af-muted);
  font-size: 12px;
}
#advisor-full .af-summary b {
  color: var(--af-text);
  font-variant-numeric: tabular-nums;
}
#advisor-full .af-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
  align-items: center;
}
#advisor-full .af-toolbar input {
  flex: 1;
  min-width: 140px;
}
#advisor-full .af-toolbar select {
  min-width: 115px;
}
#advisor-full .af-table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--af-line);
  border-radius: 8px;
  background: var(--af-panel);
}
#advisor-full table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  table-layout: fixed;
  min-width: 610px;
}
#advisor-full th {
  text-align: left;
  font-size: 11px;
  color: var(--af-muted);
  background: var(--af-sub);
  font-weight: 500;
  padding: 10px 9px;
  border-bottom: 1px solid var(--af-line);
}
#advisor-full td {
  padding: var(--af-pad) 9px;
  border-bottom: 1px solid var(--af-line);
  vertical-align: top;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
#advisor-full tr:last-child td {
  border-bottom: 0;
}
#advisor-full tbody tr:hover {
  background: var(--af-sub);
}
#advisor-full td strong {
  font-weight: 600;
}
#advisor-full td small {
  display: block;
  font-size: 11px;
  color: var(--af-muted);
  margin-top: 4px;
}
#advisor-full .af-badge {
  display: inline-block;
  border-radius: 4px;
  padding: 2px 5px;
  font-size: 11px;
  color: var(--af-accent);
  background: var(--af-tint);
  margin: 2px 2px 2px 0;
}
#advisor-full .af-ok {
  color: var(--af-good);
}
#advisor-full .af-warn {
  color: var(--af-warn);
}
#advisor-full .af-rowbtn {
  border: 0;
  color: var(--af-accent);
  padding: 3px 0;
  min-height: 30px;
  background: transparent;
  font-size: 12px;
}
#advisor-full .af-detail {
  background: var(--af-sub);
}
#advisor-full .af-detail dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px 18px;
}
#advisor-full dt {
  color: var(--af-muted);
  font-size: 11px;
  margin-bottom: 3px;
}
#advisor-full dd {
  margin: 0;
  font-size: 12px;
  overflow-wrap: anywhere;
}
#advisor-full .af-foot {
  font-size: 11px;
  color: var(--af-muted);
  display: flex;
  gap: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
  border-top: 1px solid var(--af-line);
  padding: 12px 18px;
  background: var(--af-panel);
}
#advisor-full .af-meta {
  margin: 12px 0;
  font-size: 12px;
  color: var(--af-muted);
}
#advisor-full .af-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 14px 0;
}
#advisor-full .af-kpis div {
  background: var(--af-sub);
  padding: 12px;
  border-radius: 7px;
}
#advisor-full .af-kpis span {
  display: block;
  font-size: 11px;
  color: var(--af-muted);
}
#advisor-full .af-kpis strong {
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
#advisor-full .af-check {
  width: 16px;
  height: 16px;
  min-height: 0;
  accent-color: var(--af-accent);
  vertical-align: middle;
  margin: 0 6px 0 0;
}
#advisor-full .af-bottom {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
  margin-top: 12px;
}
#advisor-full .af-bottom span {
  font-size: 12px;
  color: var(--af-muted);
}
#advisor-full .af-empty {
  padding: 28px;
  color: var(--af-muted);
  text-align: center;
}
#advisor-full .af-schema {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
#advisor-full .af-schema div {
  padding: 9px;
  background: var(--af-sub);
  border-radius: 5px;
  font-size: 12px;
}
#advisor-full details.af-group > summary {
  font-weight: 600;
  min-height: 28px;
}
#advisor-full .af-compare {
  margin-top: 16px;
}
#advisor-full .af-compare table {
  min-width: 500px;
}
#advisor-full .af-source {
  font-size: 11px;
  line-height: 1.5;
}
#advisor-full .af-mark {
  font-size: 10px;
  color: var(--af-muted);
  font-weight: 400;
  margin-left: 4px;
}
@media (max-width: 850px) {
  #advisor-full .af-shell {
    grid-template-columns: 140px minmax(0, 1fr);
  }
  #advisor-full .af-content {
    padding: 16px;
  }
  #advisor-full .af-fields {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  #advisor-full .af-kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  #advisor-full .af-nav button {
    font-size: 11px;
  }
}
@media (max-width: 600px) {
  #advisor-full .af-shell {
    grid-template-columns: 1fr;
  }
  #advisor-full aside {
    border-right: 0;
    border-bottom: 1px solid var(--af-line);
    padding: 8px;
  }
  #advisor-full .af-section-label {
    margin: 8px;
  }
  #advisor-full .af-nav {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 4px;
  }
  #advisor-full .af-nav button {
    font-size: 12px;
  }
  #advisor-full .af-content {
    padding: 14px;
  }
  #advisor-full h2 {
    font-size: 21px;
  }
  #advisor-full .af-fields {
    grid-template-columns: 1fr;
  }
  #advisor-full .af-wide {
    grid-column: auto;
  }
  #advisor-full .af-top {
    padding: 14px 100px 14px 14px;
  }
  #advisor-full .af-brand {
    font-size: 13px;
  }
  #advisor-full .af-top .af-lang {
    width: 100%;
  }
  #advisor-full .af-detail dl,
  #advisor-full .af-schema {
    grid-template-columns: 1fr;
  }
  #advisor-full input,
  #advisor-full select {
    font-size: 16px;
  }
  #advisor-full .af-kpis {
    gap: 8px;
  }
}
#advisor-full .af-workhead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
#advisor-full .af-workhead h2 {
  font-size: 22px;
}
#advisor-full .af-condition {
  display: flex;
  gap: 5px 18px;
  align-items: center;
  flex-wrap: wrap;
  border: 1px solid var(--af-line);
  background: var(--af-panel);
  border-radius: 7px;
  padding: 10px 12px;
  margin-bottom: 18px;
  font-size: 12px;
  color: var(--af-muted);
}
#advisor-full .af-condition strong {
  color: var(--af-text);
  font-size: 12px;
  font-weight: 550;
  width: 100%;
}
#advisor-full .af-results-switch {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--af-line);
}
#advisor-full .af-results-switch button {
  display: flex;
  gap: 12px;
  align-items: center;
  border-color: transparent;
  background: transparent;
  padding: 8px 13px;
  font-size: 13px;
}
#advisor-full .af-results-switch button[aria-pressed="true"] {
  background: var(--af-tint);
  border-color: var(--af-accent);
}
#advisor-full .af-results-switch b {
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
#advisor-full .af-result-tools {
  display: flex;
  gap: 10px;
  align-items: end;
  flex-wrap: wrap;
  margin-top: 14px;
}
#advisor-full .af-result-tools label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-width: 125px;
}
#advisor-full .af-result-tools label span {
  font-size: 11px;
  color: var(--af-muted);
}
#advisor-full .af-result-tools .af-searchfield {
  flex: 1.1;
}
#advisor-full .af-result-tools input,
#advisor-full .af-result-tools select {
  width: 100%;
  min-width: 0;
  font-size: 12px;
}
#advisor-full .af-sort-note {
  font-size: 11px;
  color: var(--af-muted);
  margin: 9px 0 12px;
}
#advisor-full .af-short-table td {
  padding: 12px 9px;
  vertical-align: middle;
}
#advisor-full .af-short-table td small {
  font-size: 11px;
  margin-top: 4px;
}
#advisor-full .af-short-table td label {
  display: block;
}
#advisor-full .af-pagebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
  font-size: 12px;
  color: var(--af-muted);
}
#advisor-full .af-pagebar div {
  display: flex;
  align-items: center;
  gap: 10px;
}
#advisor-full .af-pagebar button {
  min-height: 32px;
  font-size: 12px;
  padding: 5px 10px;
}
#advisor-full .af-comparebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border-top: 1px solid var(--af-line);
  padding-top: 12px;
  margin-top: 14px;
}
#advisor-full .af-comparebar span {
  font-size: 12px;
  color: var(--af-muted);
}
#advisor-full .af-primary {
  background: var(--af-accent);
  color: #fff;
  border-color: var(--af-accent);
}
#advisor-full .af-configtop,
#advisor-full .af-configend {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 14px 0;
}
#advisor-full .af-configtop span,
#advisor-full .af-configend span {
  font-size: 11px;
  color: var(--af-muted);
}
#advisor-full .af-configgroups {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 14px 0;
}
#advisor-full .af-configgroups button {
  font-size: 12px;
}
#advisor-full .af-configgroups small {
  margin-left: 7px;
}
#advisor-full .af-detail-title {
  margin: 14px 0;
  font-size: 17px;
}
#advisor-full .af-short-table table {

@media (max-width: 600px) {
  #advisor-full .af-results-switch {

  #advisor-full .af-results-switch button {
    padding: 7px 8px;
    font-size: 12px;
    gap: 7px;
  }
  #advisor-full .af-result-tools label {
    min-width: calc(50% - 8px);
  }
  #advisor-full .af-result-tools input,
  #advisor-full .af-result-tools select {
    font-size: 16px;
  }
  #advisor-full .af-result-tools button {
    min-height: 40px;
  }
  #advisor-full .af-workhead button {
    font-size: 12px;
  }

html {
  /* UI v2 uses the approved light palette regardless of the OS theme. */
  color-scheme: only light;
  background: #f4f6fa;
}
body {
  margin: 0;
  min-width: 320px;
}
button,
select {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
#advisor-full {
  border: 0;
  border-radius: 0;
}
#advisor-full .af-top {
  padding: 16px 24px;
}
#advisor-full .af-content {
  max-width: 1440px;
  width: 100%;
  margin-inline: auto;
}
#advisor-full .af-lang {
  width: auto;
}
#advisor-full .af-brand::after {
  content: "v2.1";
  font-size: 11px;
  font-weight: 400;
  color: var(--af-muted);
  margin-left: 5px;
}
#advisor-full button:focus-visible,
#advisor-full input:focus-visible,
#advisor-full select:focus-visible,
#advisor-full a:focus-visible {
  outline: 2px solid var(--af-accent);
  outline-offset: 3px;
}
.skip-link {
  position: absolute;
  top: 8px;
  left: 8px;
  transform: translateY(-200%);
  padding: 10px;
  z-index: 5;
  background: #fff;
  color: #5849b8;
}
.skip-link:focus {
  transform: none;
}
#advisor-full .af-primary:hover:not(:disabled) {
  background: var(--af-accent);
  filter: brightness(0.94);
}
@media (max-width: 600px) {
  #advisor-full .af-top {
    padding: 12px 14px;
  }
  #advisor-full .af-top .af-lang {
    width: auto;
  }
  #advisor-full aside .af-meta {
    display: none;
  }
  #advisor-full .af-nav {
    gap: 2px;
  }
  #advisor-full .af-content {
    padding: 14px;
  }
  #advisor-full .af-table-wrap:focus-visible {
    outline: 2px solid var(--af-accent);
    outline-offset: 2px;
  }
}
@media (pointer: coarse) {
  #advisor-full button,
  #advisor-full select {
    min-height: 44px;
  }
}

#advisor-full .af-mobile-table-hint {
  display: none;
}
@media (max-width: 600px) {
  #advisor-full .af-mobile-table-hint {
    display: block;
    font-size: 11px;
    color: var(--af-muted);
    margin: 8px 0;
  }
}

/* V2.1 combination workflow: compact summaries, progressively disclosed detail. */
.af-addrow {
  display: flex;
  align-items: end;
  gap: 12px;
  margin: 18px 0;
}
.af-addrow label {
  display: grid;
  gap: 6px;
  flex: 1;

.af-result-title {

  .af-addrow {

    flex-direction: column;
  }
}

\", \"inputPricePerMillionTokens\": 1.5, \"outputPricePerMillionTokens\": 6, \"cachedInputPricePerMillionTokens\": 0.4, \"lastUpdated\": \"2026-08-10\" },\n    { \"id\": \"sample-frontier-api\", \"provider\": \"Sample Cloud\", \"modelId\": \"gpt-oss-120b\", \"modelName\": \"Frontier Reasoning API\", \"currency\": \"USD\", \"inputPricePerMillionTokens\": 3, \"outputPricePerMillionTokens\": 12, \"cachedInputPricePerMillionTokens\": 0.75, \"lastUpdated\": \"2026-09-22\" }\n  ]\n}\n","filename":"cloud-pricing.json"},"../data/assumptions.json":{"type":"application/json;charset=utf-8","text":"{\n  \"schemaVersion\": 1,\n  \"catalogId\": \"assumptions\",\n  \"lastUpdated\": \"2026-09-20\",\n  \"source\": {\n    \"label\": \"Bundled calculator assumptions\",\n    \"url\": \"https://www.nist.gov/privacy-framework\",\n    \"methodology\": \"Configurable planning policy informed by risk-based governance, data minimization and processing-boundary control. These labels are not an industry-wide legal classification and should be edited for the user's organization, region and operating environment. Local inference planning quantizes KV cache to Q8 (1 byte per K/V element); fallbackKvCacheBytesPerTokenByTier values are Q8 bytes/token.\"\n  },\n  \"data\": [\n    {\n      \"currency\": \"USD\",\n      \"capabilityTiers\": [\n        {\n          \"id\": \"basic\",\n          \"labels\": { \"en\": \"Basic\", \"zh-CN\": \"基础\" },\n          \"rank\": 0,\n          \"description\": { \"en\": \"Routine language tasks with clear instructions and limited reasoning depth; efficiency matters more than handling difficult edge cases.\", \"zh-CN\": \"适合指令清晰、推理深度有限的常规语言任务；更看重资源效率，不要求处理复杂边界情况。\" },\n          \"example\": { \"en\": \"Examples: classification, extraction, short summaries and FAQ drafting.\", \"zh-CN\": \"示例：分类、信息抽取、短摘要和常见问答草拟。\" },\n          \"recommendationImpact\": { \"en\": \"The calculator may choose the smallest eligible model with supporting evidence.\", \"zh-CN\": \"计算器可选择有证据支持的最小可用模型。\" }\n        },\n        {\n          \"id\": \"balanced\",\n          \"labels\": { \"en\": \"Balanced\", \"zh-CN\": \"均衡\" },\n          \"rank\": 1,\n          \"description\": { \"en\": \"General business quality for common knowledge work, with moderate reasoning and instruction following at a practical cost.\", \"zh-CN\": \"面向常见知识工作的通用业务质量，在适中成本下提供中等推理与指令遵循能力。\" },\n          \"example\": { \"en\": \"Examples: internal copilots, document Q&A, routine analysis and everyday coding assistance.\", \"zh-CN\": \"示例：内部 Copilot、文档问答、常规分析和日常编程辅助。\" },\n          \"recommendationImpact\": { \"en\": \"The calculator favors mainstream mid-tier models that balance quality, speed and cost.\", \"zh-CN\": \"计算器会偏向在质量、速度与成本之间折中的主流中档模型。\" }\n        },\n        {\n          \"id\": \"advanced\",\n          \"labels\": { \"en\": \"Advanced\", \"zh-CN\": \"高级\" },\n          \"rank\": 2,\n          \"description\": { \"en\": \"Complex multi-step work that needs stronger reasoning, coding, tool use or long-context reliability, where errors have meaningful business impact.\", \"zh-CN\": \"适合需要更强推理、编程、工具调用或长上下文可靠性的复杂多步任务，错误会带来明显业务影响。\" },\n          \"example\": { \"en\": \"Examples: coding agents, complex RAG synthesis, workflow agents and expert document review.\", \"zh-CN\": \"示例：编程 Agent、复杂 RAG 综合、工作流 Agent 和专家级文档审阅。\" },\n          \"recommendationImpact\": { \"en\": \"The calculator requires a higher-ranked model and may accept higher memory, latency or cost.\", \"zh-CN\": \"计算器会要求更高能力档模型，并可能接受更高显存、延迟或成本。\" }\n        },\n        {\n          \"id\": \"frontier\",\n          \"labels\": { \"en\": \"Frontier\", \"zh-CN\": \"前沿\" },\n          \"rank\": 3,\n          \"description\": { \"en\": \"The hardest novel, expert or high-consequence tasks where the best available capability is prioritized over cost and deployment simplicity.\", \"zh-CN\": \"面向最困难、创新性强、专家级或高后果任务，优先追求当前最佳能力，而非成本和部署简易度。\" },\n          \"example\": { \"en\": \"Examples: difficult research, frontier agentic coding and high-stakes expert analysis with human review.\", \"zh-CN\": \"示例：高难度研究、前沿 Agent 编程，以及配有人审的高风险专家分析。\" },\n          \"recommendationImpact\": { \"en\": \"The calculator considers only the highest configured capability tier; cloud escalation may be required if local evidence is insufficient.\", \"zh-CN\": \"计算器只考虑配置中最高能力档；本地证据不足时可能需要升级到云端。\" }\n        }\n      ],\n      \"workloadDefinitions\": {\n        \"privacy\": {\n          \"low\": {\n            \"labels\": { \"en\": \"Low privacy\", \"zh-CN\": \"低隐私\" },\n            \"description\": { \"en\": \"Public, synthetic or non-sensitive content. External cloud processing is normally acceptable.\", \"zh-CN\": \"公开、合成或非敏感内容，通常可以接受外部云端处理。\" },\n            \"example\": { \"en\": \"Examples: public documents, demos and synthetic test data.\", \"zh-CN\": \"示例：公开文档、演示内容和合成测试数据。\" },\n            \"recommendationImpact\": { \"en\": \"Cloud is allowed; capability and economics drive the recommendation.\", \"zh-CN\": \"允许使用云端，推荐主要由能力与经济性决定。\" }\n          },\n          \"medium\": {\n            \"labels\": { \"en\": \"Medium privacy\", \"zh-CN\": \"中等隐私\" },\n            \"description\": { \"en\": \"Routine internal business data without regulated or high-value secrets. Use approved providers and retention controls.\", \"zh-CN\": \"常规内部业务数据，不包含受监管信息或高价值机密；应使用获批服务商并控制数据留存。\" },\n            \"example\": { \"en\": \"Examples: internal summaries, ordinary operations and non-sensitive support content.\", \"zh-CN\": \"示例：内部摘要、常规运营资料和非敏感客服内容。\" },\n            \"recommendationImpact\": { \"en\": \"Cloud remains possible when organizational controls are satisfied.\", \"zh-CN\": \"满足组织安全控制后仍可采用云端。\" }\n          },\n          \"high\": {\n            \"labels\": { \"en\": \"High privacy\", \"zh-CN\": \"高隐私\" },\n            \"description\": { \"en\": \"Raw sensitive content stays inside an organization-controlled local or private boundary. Hybrid processing may send only redacted, minimized context or a non-sensitive subtask to an approved cloud.\", \"zh-CN\": \"原始敏感内容留在组织可控的本地或私有边界内；混合计算只能向获批云端发送脱敏、最小化后的上下文或非敏感子任务。\" },\n            \"example\": { \"en\": \"Examples: unreleased products, private repositories and customer-confidential documents.\", \"zh-CN\": \"示例：未发布产品、私有代码库和客户保密文档。\" },\n            \"recommendationImpact\": { \"en\": \"Local or Hybrid is preferred. Public cloud must not receive raw sensitive fields; any escalation requires explicit organizational controls.\", \"zh-CN\": \"优先本地或混合部署；公共云不得接收原始敏感字段，任何云端升级都必须经过明确的组织控制。\" }\n          },\n          \"critical\": {\n            \"labels\": { \"en\": \"Critical privacy\", \"zh-CN\": \"关键隐私\" },\n            \"description\": { \"en\": \"All prompts, context, retrieved data, outputs and inference telemetry remain inside the approved local, on-premises or sovereign boundary.\", \"zh-CN\": \"提示词、上下文、检索数据、输出和推理遥测全部留在获批的本地、企业内网或主权边界内。\" },\n            \"example\": { \"en\": \"Examples: protected health data, classified workloads and strict data-residency cases.\", \"zh-CN\": \"示例：受保护健康数据、涉密工作负载和严格数据驻留场景。\" },\n            \"recommendationImpact\": { \"en\": \"Public-cloud inference is prohibited by this planning policy. Local is a hard requirement; the calculator reports a conflict when no capable local path exists.\", \"zh-CN\": \"本规划策略禁止公共云推理；本地部署是硬性要求，没有可行本地方案时计算器会明确报告约束冲突。\" }\n          }\n        },\n        \"latency\": {\n          \"best-effort\": {\n            \"labels\": { \"en\": \"Best effort\", \"zh-CN\": \"尽力而为\" },\n            \"description\": { \"en\": \"Background or asynchronous work where the user is not waiting on every response.\", \"zh-CN\": \"后台或异步任务，用户不会等待每一次响应。\" },\n            \"example\": { \"en\": \"Examples: batch classification, nightly summaries and offline document processing.\", \"zh-CN\": \"示例：批量分类、夜间摘要和离线文档处理。\" },\n            \"recommendationImpact\": { \"en\": \"Planning target: first token within about 10 seconds; throughput and cost usually matter more.\", \"zh-CN\": \"规划目标：首 Token 约 10 秒内；通常吞吐量和成本更重要。\" },\n            \"targetTimeToFirstTokenSeconds\": 10\n          },\n          \"interactive\": {\n            \"labels\": { \"en\": \"Interactive\", \"zh-CN\": \"交互式\" },\n            \"description\": { \"en\": \"A person is actively waiting, but a short conversational pause is acceptable.\", \"zh-CN\": \"用户正在等待响应，但可以接受短暂的对话停顿。\" },\n            \"example\": { \"en\": \"Examples: chat assistants, document Q&A and internal copilots.\", \"zh-CN\": \"示例：聊天助手、文档问答和内部 Copilot。\" },\n            \"recommendationImpact\": { \"en\": \"Planning target: first token within about 2 seconds.\", \"zh-CN\": \"规划目标：首 Token 约 2 秒内。\" },\n            \"targetTimeToFirstTokenSeconds\": 2\n          },\n          \"fast\": {\n            \"labels\": { \"en\": \"Fast\", \"zh-CN\": \"快速\" },\n            \"description\": { \"en\": \"The response should feel immediate enough to preserve a rapid working rhythm.\", \"zh-CN\": \"响应应足够即时，以保持快速连续的工作节奏。\" },\n            \"example\": { \"en\": \"Examples: coding assistance, rapid search and high-frequency agent interaction.\", \"zh-CN\": \"示例：编程辅助、快速检索和高频 Agent 交互。\" },\n            \"recommendationImpact\": { \"en\": \"Planning target: first token within about 1 second.\", \"zh-CN\": \"规划目标：首 Token 约 1 秒内。\" },\n            \"targetTimeToFirstTokenSeconds\": 1\n          },\n          \"real-time\": {\n            \"labels\": { \"en\": \"Real time\", \"zh-CN\": \"实时\" },\n            \"description\": { \"en\": \"Delay interrupts a live conversation or control loop and must be minimized end to end.\", \"zh-CN\": \"延迟会打断实时对话或控制循环，需要尽量降低端到端等待。\" },\n            \"example\": { \"en\": \"Examples: live voice turns, operator assistance and interactive control.\", \"zh-CN\": \"示例：实时语音轮次、操作员辅助和交互控制。\" },\n            \"recommendationImpact\": { \"en\": \"Planning target: first token within about 0.25 seconds; the engine prefers a local network path when feasible.\", \"zh-CN\": \"规划目标：首 Token 约 0.25 秒内；可行时引擎会偏好本地网络路径。\" },\n            \"targetTimeToFirstTokenSeconds\": 0.25\n          }\n        }\n      },\n      \"economics\": {\n        \"electricityPricePerKWh\": 0.15,\n        \"hardwareLifetimeMonths\": 36,\n        \"maintenanceCostMonthly\": 75,\n        \"defaultUtilizationRatio\": 0.45,\n        \"defaultCachedInputRatio\": 0.1,\n        \"hostPurchasePriceUSD\": 2500,\n        \"hostIdlePowerWatts\": 80,\n        \"hostLoadPowerWatts\": 250,\n        \"gpuIdlePowerRatio\": 0.15\n      },\n      \"vram\": {\n        \"defaultRuntimeOverheadRatio\": 0.1,\n        \"minimumRuntimeOverheadGB\": 2,\n        \"safetyMarginRatio\": 0.15,\n        \"fallbackKvCacheBytesPerTokenByTier\": {\n          \"basic\": 65536,\n          \"balanced\": 98304,\n          \"advanced\": 163840,\n          \"frontier\": 393216\n        },\n        \"fitThresholds\": {\n          \"marginalCapacityRatio\": 0.85,\n          \"recommendedCapacityRatio\": 1,\n          \"comfortableCapacityRatio\": 1.25\n        }\n      },\n      \"multiGpuEfficiency\": {\n        \"pcie\": { \"1\": 1, \"2\": 0.82, \"4\": 0.65 },\n        \"nvlink\": { \"1\": 1, \"2\": 0.92, \"4\": 0.84 },\n        \"unified\": { \"1\": 1, \"2\": 0.95, \"4\": 0.9 },\n        \"other\": { \"1\": 1, \"2\": 0.75, \"4\": 0.55 }\n      },\n      \"simpleModeMappings\": {\n        \"useCases\": {\n          \"ai-assistant\": { \"labels\": { \"en\": \"AI assistant\", \"zh-CN\": \"AI 助手\" }, \"averageInputTokens\": 900, \"averageOutputTokens\": 350, \"averageAgentSteps\": 1, \"peakConcurrentUsersRatio\": 0.2, \"averageContextLength\": 4096, \"peakContextLength\": 8192 },\n          \"enterprise-agent\": { \"labels\": { \"en\": \"Enterprise agent\", \"zh-CN\": \"企业智能体\" }, \"averageInputTokens\": 1800, \"averageOutputTokens\": 650, \"averageAgentSteps\": 4, \"peakConcurrentUsersRatio\": 0.35, \"averageContextLength\": 8192, \"peakContextLength\": 16384 },\n          \"coding\": { \"labels\": { \"en\": \"Coding\", \"zh-CN\": \" ;\n    }\n    .ldc .formula em {\n      display: block;\n      font-style: normal;\n      color: #9aabc0;\n      font-size: 9px;\n      margin-top: 3px;\n      line-height: 1.35;\n      font-weight: 500;\n    }\n    .ldc .formula i {\n      text-align: center;\n      color: #9793ff;\n      font-weight: 800;\n      font-style: normal;\n    }\n    .ldc .options {\n      display: grid;\n      gap: 8px;\n    }\n    .ldc .option {\n      border: 1px solid #3c4960;\n      background: #141b29;\n      border-radius: 8px;\n      padding: 11px;\n    }\n    .ldc .option.pass {\n      border-color: #6e69df;\n      background: #211f43;\n    }\n    .ldc .option h3 {\n      font-size: 12px;\n      margin: 0;\n    }\n    .ldc .option p {\n      font-size: 11px;\n      color: #a7b5c8;\n      line-height: 1.45;\n      margin: 5px 0;\n    }\n    .ldc .tag {\n      display: inline-block;\n      font-size: 10px;\n      background: #2a3548;\n      border-radius: 4px;\n      padding: 4px 5px;\n      color: #c0cce0;\n      margin-right: 4px;\n    }\n    .ldc .tag.good {\n      background: #1d503c;\n      color: #bcefd0;\n    }\n    .ldc .right {\n      background: #101723;\n      border-left: 1px solid #29344a;\n      padding: 18px 14px;\n    }\n    .ldc .summary {\n      background: linear-gradient(145deg, #302b65, #5048aa);\n      padding: 15px;\n      border-radius: 10px;\n    }\n    .ldc .summary h2 {\n      font-size: 16px;\n      margin: 7px 0;\n    }\n    .ldc .summary p {\n      font-size: 11px;\n      color: #e1e0ff;\n      line-height: 1.5;\n    }\n    .ldc .row {\n      font-size: 11px;\n      border-top: 1px solid #716dc0;\n      padding: 10px 0;\n      display: flex;\n      justify-content: space-between;\n      gap: 6px;\n    }\n    .ldc .row span {\n      color: #d1cfff;\n    }\n    .ldc .good {\n      color: #bdf2d1;\n    }\n    .ldc .side {\n      border: 1px solid #303b50;\n      background: #1a2334;\n      border-radius: 9px;\n      padding: 12px;\n      margin-top: 12px;\n    }\n    .ldc .side h3 {\n      font-size: 12px;\n      margin: 0 0 6px;\n    }\n    .ldc .side p {\n      font-size: 11px;\n      line-height: 1.5;\n      color: #a5b3c7;\n      margin: 0;\n    }\n    @media (max-width: 1120px) {\n      .ldc {\n        grid-template-columns: minmax(210px, 230px) minmax(0, 1fr);\n      }\n      .ldc .right {\n        display: none;\n      }\n    }\n    @media (max-width: 680px) {\n      .ldc {\n        grid-template-columns: 1fr;\n      }\n      .ldc aside { display: flex; }\n      .ldc main {\n        padding: 18px;\n      }\n      .ldc .grid,\n      .ldc .formula {\n        grid-template-columns: 1fr;\n      }\n      .ldc .formula i {\n        display: none;\n      }\n    }\n  \u003c/style>\n  \u003cstyle>\n    #live-deployment-calculator { width: 100%; max-width: 100%; overflow-x: hidden; }\n    #live-deployment-calculator .formula div { background: #202b40 !important; border: 1px solid #465777 !important; color: #f7f9ff !important; }\n    #live-deployment-calculator h1, #live-deployment-calculator h2, #live-deployment-calculator h3, #live-deployment-calculator strong { color: #ffffff !important; }\n    #live-deployment-calculator .formula label, #live-deployment-calculator label { color: #c7d5ea !important; }\n    #live-deployment-calculator .formula em { color: #b7c6da !important; }\n    #live-deployment-calculator .hint, #live-deployment-calculator .sub, #live-deployment-calculator .option p, #live-deployment-calculator .side p { color: #c7d5ea !important; }\n    #live-deployment-calculator .formula strong { color: #ffffff !important; font-weight: 800; }\n    #live-deployment-calculator .option h3 { color: #f5f7ff !important; }\n    #live-deployment-calculator .option p { color: #c7d2e5 !important; }\n    #live-deployment-calculator .summary .row b { color: #ffffff !important; text-align: right; }\n    #live-deployment-calculator .summary .row b.good { color: #d2ffe1 !important; }\n    #live-deployment-calculator .summary .row.device-list { display: block; }\n    #live-deployment-calculator .summary .row.device-list b { display: block; margin-top: 5px; line-height: 1.45; max-height: 180px; overflow-y: auto; padding-right: 4px; }\n    #live-deployment-calculator .summary .row { display: block; }\n    #live-deployment-calculator .summary .row b { display: block; margin-top: 5px; text-align: left !important; }\n    #live-deployment-calculator .summary .device-line { display: block; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.18); }\n    #live-deployment-calculator .summary .device-line:last-child { border-bottom: 0; }\n    #live-deployment-calculator .action { border: 1px solid #7773df; background: #393579; color: #fff; border-radius: 6px; padding: 8px 10px; font-size: 11px; cursor: pointer; margin: 3px 4px 7px 0; }\n    #live-deployment-calculator .language-toggle { display: inline-flex; padding: 3px; border: 1px solid #3b4860; background: #111827; border-radius: 8px; }\n    #live-deployment-calculator .language-toggle button { border: 0; background: transparent; color: #94a3b8; padding: 6px 9px; border-radius: 5px; font-size: 11px; cursor: pointer; }\n    #live-deployment-calculator .language-toggle button.active { background: #5b54b8; color: #fff; font-weight: 800; }\n    #live-deployment-calculator .modal-backdrop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(4,8,16,.76); z-index: 20; }\n    #live-deployment-calculator .modal-backdrop.show { display: flex; }\n    #live-deployment-calculator .modal { width: min(760px, 100%); max-height: min(720px, 92vh); overflow: auto; background: #182236; border: 1px solid #53617d; border-radius: 12px; padding: 18px; }\n    #live-deployment-calculator .modal-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }\n    #live-deployment-calculator .modal .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n    #live-deployment-calculator .modal label { display: block; color: #c7d5ea; font-size: 11px; margin-bottom: 5px; }\n    #live-deployment-calculator .modal input, #live-deployment-calculator .modal select { width: 100%; min-width: 0; border: 1px solid #485a78; background: #101827; color: #f5f7ff; border-radius: 7px; padding: 9px 10px; font-size: 12px; }\n    @media (max-width: 620px) { #live-deployment-calculator .modal .grid { grid-template-columns: minmax(0, 1fr); } }\n    @media (max-width: 1280px) {\n      #live-deployment-calculator .ldc { grid-template-columns: minmax(210px, 230px) minmax(0, 1fr) !important; overflow-x: hidden; }\n      #live-deployment-calculator .right { grid-column: 2; border-left: 0; border-top: 1px solid #29344a; }\n    }\n    @media (max-width: 760px) {\n      #live-deployment-calculator .ldc { grid-template-columns: minmax(0, 1fr) !important; }\n      #live-deployment-calculator aside {\n        display: flex !important;\n        align-items: center;\n        gap: 6px;\n        padding: 10px 12px;\n        overflow-x: auto;\n        overscroll-behavior-x: contain;\n        border-right: 0;\n        border-bottom: 1px solid #29344a;\n        scrollbar-width: thin;\n      }\n      #live-deployment-calculator aside .brand {\n        flex: 0 0 auto;\n        padding: 2px 10px 2px 2px;\n        font-size: 12px;\n      }\n      #live-deployment-calculator aside .brand b { font-size: 15px; }\n      #live-deployment-calculator aside .sec { display: none; }\n      #live-deployment-calculator aside button {\n        width: auto;\n        flex: 0 0 auto;\n        margin: 0;\n        padding: 8px 10px;\n        white-space: nowrap;\n      }\n      #live-deployment-calculator main { padding: 18px 14px; }\n      #live-deployment-calculator .right { grid-column: 1; }\n      #live-deployment-calculator .grid, #live-deployment-calculator .formula { grid-template-columns: minmax(0, 1fr) !important; }\n      #live-deployment-calculator .formula i { display: none; }\n    }\n  \u003c/style>\n  \u003cdiv class=\"ldc\">\n    \u003caside>\n      \u003cdiv class=\"brand\">\u003cb>◈\u003c/b>AI Compute Advisor\u003c/div>\n      \u003cdiv class=\"sec\">方案工作台\u003c/div>\n      \u003cbutton class=\"on\" id=\"modelMode\">模型找硬件\u003c/button>\u003cbutton id=\"hardwareMode\">硬件找模型\u003c/button\n      >\u003cbutton id=\"devicePool\">设备池\u003c/button>\n      \u003cdiv class=\"sec\" style=\"margin-top: 28px\">设置\u003c/div>\n      \u003cbutton id=\"generalSettings\">通用\u003c/button>\u003cbutton id=\"modelLibrary\">模型库（22）\u003c/button>\u003cbutton id=\"deviceLibrary\">设备库（14）\u003c/button>\n      >\u003cbutton id=\"performanceLibrary\">性能资料库\u003c/button>\u003cbutton id=\"connectionSettings\">数据与 API\u003c/button>\n    \u003c/aside>\n    \u003cmain>\n      \u003cheader>\n        \u003cdiv>\n          \u003cdiv class=\"kick\">方案工作台 / 实时计算\u003c/div>\n          \u003ch1>模型与设备匹配\u003c/h1>\n          \u003cp class=\"sub\">\n            选择后立即刷新结果。\n          \u003c/p>\n          \u003cp id=\"localDataNotice\" class=\"local-data-notice\">自定义数据仅保存在本浏览器。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"language-toggle\" aria-label=\"Language\">\u003cbutton id=\"langZh\" type=\"button\" class=\"active\">中文\u003c/button>\u003cbutton id=\"langEn\" type=\"button\">EN\u003c/button>\u003c/div>\n      \u003c/header>\n      \u003cdiv id=\"modelFlow\">\u003csection class=\"card\">\n        \u003ch2>运行约束\u003c/h2>\n        \u003cp class=\"hint\">\n          共 22 个模型。量化越小越省显存；上下文越长、同时用的人越多，显存越高。\n        \u003c/p>\n        \u003cdiv class=\"grid\">\n          \u003cdiv>\n            \u003clabel>目标模型\u003c/label\n            >\u003cselect id=\"model\">\u003c/select>\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel>量化\u003c/label\n            >\u003cselect id=\"quant\">\u003c/select>\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel>上下文\u003c/label\n            >\u003cselect id=\"context\">\n              \u003coption value=\"16\">16K\u003c/option>\n              \u003coption value=\"32\" selected>32K\u003c/option>\n              \u003coption value=\"64\">64K\u003c/option>\n              \u003coption value=\"128\">128K\u003c/option>\n              \u003coption value=\"256\">256K\u003c/option>\n              \u003coption value=\"1024\">1M\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel>峰值并发（同时用的人数）\u003c/label\n            >\u003cinput id=\"concurrency\" type=\"number\" value=\"1\" min=\"1\" />\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel>峰值 Token（选填）\u003c/label\n            >\u003cinput id=\"modelPeakIo\" placeholder=\"未知时采用场景上限假设\" />\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel>目标速度（每秒 Token）\u003c/label\n            >\u003cinput id=\"tps\" type=\"number\" value=\"20\" min=\"1\" />\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel>显存上限（%）\u003c/label\n            >\u003cinput id=\"modelVramUtilization\" type=\"number\" value=\"90\" min=\"50\" max=\"99\" step=\"1\" />\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"card\">\n        \u003ch2>计算依据\u003c/h2>\n        \u003cp class=\"hint\" id=\"modelMeta\">\u003c/p>\n        \u003cdiv id=\"offloadBox\" class=\"option pass\" style=\"display:none;margin:12px 0 0\">\n          \u003ch3 id=\"offloadTitle\">AI Fusion 2.0\u003c/h3>\n          \u003cp id=\"offloadText\">约 5GB 模型放到电脑内存，约 1GB 对话缓存放到 SSD，GPU 只留 5% 余量。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"formula\">\n          \u003cdiv>\u003clabel id=\"weightLabel\">权重显存\u003c/label>\u003cstrong id=\"weight\">\u003c/strong>\u003cem id=\"weightHint\">模型本身占用\u003c/em>\u003c/div>\n          \u003ci>+\u003c/i>\n          \u003cdiv>\u003clabel id=\"kvLabel\">KV Cache\u003c/label>\u003cstrong id=\"kv\">\u003c/strong>\u003cem id=\"kvHint\">对话上下文占用\u003c/em>\u003c/div>\n          \u003ci>+\u003c/i>\n          \u003cdiv>\n            \u003clabel id=\"reserveLabel\">安全余量\u003c/label>\u003cstrong id=\"reserve\">\u003c/strong>\n            \u003cem id=\"reserveHint\">预留缓冲，避免占满\u003c/em>\n          \u003c/div>\n          \u003ci>=\u003c/i>\n          \u003cdiv>\u003clabel id=\"needLabel\">推荐显存\u003c/label>\u003cstrong id=\"need\">\u003c/strong>\u003cem id=\"needHint\">建议至少准备\u003c/em>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"hint\" id=\"formulaText\" style=\"margin-top: 12px\">\u003c/p>\n        \u003cp class=\"hint\" id=\"sourceText\">来源：\u003ca href=\"https://huggingface.co/models\" target=\"_blank\" rel=\"noopener\">Hugging Face\u003c/a>。本地 KV 为 Q8；吞吐需压测。\u003c/p>\n      \u003c/section>\n      \u003csection class=\"card\">\n        \u003ch2>可行方案\u003c/h2>\n        \u003cp class=\"hint\" id=\"optionsHint\">\n          每条是一台完整机器。显存够用才会出现。\n        \u003c/p>\n        \u003cdiv id=\"options\" class=\"options\">\u003c/div>\n      \u003c/section>\u003c/div>\n      \u003cdiv id=\"hardwareFlow\" style=\"display:none\">\n        \u003csection class=\"card\">\u003ch2>已有硬件\u003c/h2>\u003cp class=\"hint\">按这台机器的 GPU 显存，反推哪些模型能放进去。\u003c/p>\n          \u003ch3 style=\"font-size:12px;margin:14px 0 8px\">快速评估（常用）\u003c/h3>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel>已有设备\u003c/label>\u003cselect id=\"hardware\">\u003c/select>\u003c/div>\u003cdiv>\u003clabel>设备台数\u003c/label>\u003cinput id=\"hardwareCount\" type=\"number\" value=\"1\" min=\"1\" />\u003c/div>\u003cdiv>\u003clabel>模型能力筛选\u003c/label>\u003cselect id=\"capability\">\u003coption value=\"all\">全部开放模型\u003c/option>\u003coption value=\"reasoning\">推理 / Agent\u003c/option>\u003coption value=\"coding\">代码生成\u003c/option>\u003coption value=\"multimodal\">多模态 / 视觉\u003c/option>\u003coption value=\"document\">文档理解 / RAG\u003c/option>\u003coption value=\"translation\">翻译 / 多语言\u003c/option>\u003coption value=\"text\">通用文本问答\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>量化\u003c/label>\u003cselect id=\"hardwareQuant\">\u003coption value=\"4\" selected>Q4\u003c/option>\u003coption value=\"8\">Q8\u003c/option>\u003coption value=\"16\">FP16 / BF16\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>上下文长度\u003c/label>\u003cselect id=\"hardwareContext\">\u003coption value=\"16\">16K\u003c/option>\u003coption value=\"32\" selected>32K\u003c/option>\u003coption value=\"64\">64K\u003c/option>\u003coption value=\"128\">128K\u003c/option>\u003coption value=\"256\">256K\u003c/option>\u003coption value=\"512\">512K\u003c/option>\u003coption value=\"1024\">1M\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>峰值并发（同时用的人数）\u003c/label>\u003cinput id=\"hardwareConcurrency\" type=\"number\" value=\"1\" min=\"1\" />\u003c/div>\u003cdiv>\u003clabel>目标速度（每秒 Token）\u003c/label>\u003cinput id=\"hardwareTps\" type=\"number\" value=\"20\" min=\"1\" />\u003c/div>\u003cdiv>\u003clabel>AI 加速卡（微调）\u003c/label>\u003cselect id=\"acceleratorTier\">\u003coption value=\"0\">无\u003c/option>\u003coption value=\"320\">320GB\u003c/option>\u003coption value=\"1024\">1TB\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n          \u003cdetails id=\"advancedRequirements\" style=\"margin-top:14px\">\u003csummary style=\"cursor:pointer;color:#c7d5ea;font-size:11px\">补充要求（选填）\u003c/summary>\u003cdiv class=\"grid\" style=\"margin-top:12px\">\u003cdiv>\u003clabel>峰值输入 / 输出 Token\u003c/label>\u003cinput id=\"hardwareIo\" placeholder=\"例如 8K / 2K；未知可留空\" />\u003c/div>\u003cdiv>\u003clabel>TTFT 目标（秒）\u003c/label>\u003cinput id=\"hardwareTtft\" type=\"number\" placeholder=\"可选\" min=\"0\" step=\"0.1\" />\u003c/div>\u003cdiv>\u003clabel>系统内存\u003c/label>\u003cselect id=\"systemRam\">\u003coption value=\"16\">16GB\u003c/option>\u003coption value=\"32\">32GB\u003c/option>\u003coption value=\"64\" selected>64GB\u003c/option>\u003coption value=\"128\">128GB\u003c/option>\u003coption value=\"256\">256GB\u003c/option>\u003coption value=\"custom\">客户指定，待补充\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>允许跨设备分片\u003c/label>\u003cselect id=\"hardwareSharding\">\u003coption value=\"no\">否：仅做副本并发\u003c/option>\u003coption value=\"yes\" selected>是：需验证运行时\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>多机互联能力\u003c/label>\u003cselect id=\"interconnect\">\u003coption>未知 / 待验证\u003c/option>\u003coption>标准以太网\u003c/option>\u003coption>高速网络\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>本地 / 混合云\u003c/label>\u003cselect id=\"dataBoundary\">\u003coption>必须本地\u003c/option>\u003coption>脱敏后可上云\u003c/option>\u003coption>允许混合云\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>预算上限\u003c/label>\u003cinput placeholder=\"选填\" />\u003c/div>\u003cdiv>\u003clabel>功耗上限（W）\u003c/label>\u003cinput placeholder=\"选填\" />\u003c/div>\u003cdiv>\u003clabel>目标运行时\u003c/label>\u003cselect>\u003coption>未指定\u003c/option>\u003coption>vLLM\u003c/option>\u003coption>SGLang\u003c/option>\u003coption>llama.cpp\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>高可用需求\u003c/label>\u003cselect>\u003coption>无\u003c/option>\u003coption>需要 N+1\u003c/option>\u003coption>需要跨机房\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003c/details>\n        \u003c/section>\n        \u003csection class=\"card\">\u003ch2>可部署模型\u003c/h2>\u003cp class=\"hint\" id=\"hardwareMeta\">\u003c/p>\u003cdiv id=\"hardwareOptions\" class=\"options\">\u003c/div>\u003c/section>\n      \u003c/div>\n      \u003cdiv id=\"secondaryFlow\" style=\"display:none\">\u003c/div>\n    \u003c/main>\n    \u003cdiv class=\"right\">\n      \u003cdiv class=\"summary\">\n        \u003clabel>当前方案摘要\u003c/label>\n        \u003ch2 id=\"title\">\u003c/h2>\n        \u003cp id=\"desc\">\u003c/p>\n        \u003cdiv class=\"row\">\n          \u003cspan id=\"sumMemoryLabel\">模型占用 / 对话缓存\u003c/span>\u003cb id=\"sumMemory\">\u003c/b>\n        \u003c/div>\n        \u003cdiv class=\"row\">\n          \u003cspan id=\"sumNeedLabel\">建议 GPU 显存\u003c/span>\u003cb class=\"good\" id=\"sumNeed\">\u003c/b>\n        \u003c/div>\n        \u003cdiv class=\"row\">\u003cspan id=\"sumTpsLabel\">目标速度（每秒 Token）\u003c/span>\u003cb id=\"sumTps\">\u003c/b>\u003c/div>\n        \u003cdiv class=\"row\">\u003cspan id=\"acceleratorSummaryLabel\">Post training（微调）\u003c/span>\u003cb id=\"sumAccelerator\">\u003c/b>\u003c/div>\n        \u003cdiv class=\"row device-list\">\u003cspan id=\"machineListLabel\">部署设备清单\u003c/span>\u003cb id=\"sumMachineList\">\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"side\">\u003ch3 id=\"evidenceTitle\">方案说明\u003c/h3>\u003cp id=\"evidenceText\">数字会随左侧选择变化。建议显存 = 模型占用 + 对话缓存 + 预留缓冲。\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"deviceModal\" class=\"modal-backdrop\" role=\"dialog\" aria-modal=\"true\" aria-label=\"新增设备\">\n    \u003cdiv class=\"modal\">\u003cdiv class=\"modal-header\">\u003ch2>新增设备配置\u003c/h2>\u003cbutton id=\"closeDeviceModal\" class=\"action\" type=\"button\">关闭\u003c/button>\u003c/div>\n      \u003cp class=\"hint\">新增后待审核，通过后才参与推荐。\u003c/p>\n      \u003cdiv class=\"grid\">\n        \u003cdiv>\u003clabel>设备名称\u003c/label>\u003cinput id=\"newDeviceName\" placeholder=\"例如：客户指定 Intel B60 工作站\" />\u003c/div>\u003cdiv>\u003clabel>设备平台\u003c/label>\u003cselect>\u003coption>ThinkCentre X Tower\u003c/option>\u003coption>ThinkCentre X Ultra\u003c/option>\u003coption>客户指定硬件\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv>\u003clabel>GPU 厂商 / 型号\u003c/label>\u003cinput placeholder=\"例如：Intel B60\" />\u003c/div>\u003cdiv>\u003clabel>单卡显存（GB）\u003c/label>\u003cinput type=\"number\" placeholder=\"24\" />\u003c/div>\n        \u003cdiv>\u003clabel>支持卡数\u003c/label>\u003cinput type=\"number\" placeholder=\"1\" />\u003c/div>\u003cdiv>\u003clabel>系统内存（GB）\u003c/label>\u003cinput type=\"number\" placeholder=\"128\" />\u003c/div>\n        \u003cdiv>\u003clabel>显存带宽（GB/s）\u003c/label>\u003cinput type=\"number\" placeholder=\"填写已知值\" />\u003c/div>\u003cdiv>\u003clabel>GPU TDP（W）\u003c/label>\u003cinput type=\"number\" placeholder=\"填写已知值\" />\u003c/div>\n        \u003cdiv>\u003clabel>峰值 AI TOPS\u003c/label>\u003cinput type=\"number\" placeholder=\"填写已知值\" />\u003c/div>\u003cdiv>\u003clabel>整机价格（选填）\u003c/label>\u003cinput id=\"newDevicePrice\" type=\"number\" placeholder=\"填写报价后才在方案显示\" />\u003c/div>\n        \u003cdiv>\u003clabel>可用于方案的最大台数\u003c/label>\u003cinput type=\"number\" value=\"1\" min=\"1\" />\u003c/div>\u003cdiv>\u003clabel>跨设备模型分片\u003c/label>\u003cselect>\u003coption>未知 / 待验证\u003c/option>\u003coption>支持\u003c/option>\u003coption>不支持\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv>\u003clabel>AI 加速卡扩展\u003c/label>\u003cselect>\u003coption>无\u003c/option>\u003coption>320GB\u003c/option>\u003coption>1TB\u003c/option>\u003coption>自定义\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>性能证据状态\u003c/label>\u003cselect>\u003coption>待压测\u003c/option>\u003coption>内部实测\u003c/option>\u003coption>厂商资料\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv>\u003clabel>测试运行时\u003c/label>\u003cinput placeholder=\"例如：vLLM / SGLang\" />\u003c/div>\u003cdiv>\u003clabel>备注与来源\u003c/label>\u003cinput placeholder=\"型号、报价或测试资料链接\" />\u003c/div>\n      \u003c/div>\u003cdiv style=\"margin-top:14px\">\u003cbutton class=\"action\" id=\"saveDevice\" type=\"button\">保存为待审核设备\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cscript>\n    (function () {\n      const r = document.getElementById(\"live-deployment-calculator\");\n      const M = [\n        [\n          \"Qwen3 8B\",\n          8.2,\n          73728,\n          131072,\n          [\"Q4\", 4],\n          [\"Q8\", 8],\n          [\"FP16\", 16],\n        ],\n        [\n          \"Llama 3.2 3B Instruct\",\n          3.21,\n          57344,\n          131072,\n          [\"Q4\", 4],\n          [\"Q8\", 8],\n          [\"FP16\", 16],\n        ],\n        [\n          \"Qwen3 14B\",\n          14.8,\n          81920,\n          131072,\n       "",
    )}</select></label><label class="af-searchfield"><span>${T("模型名称", "Model name")}</span><input id="af-result-search" value="${esc(state.resultSearch)}" placeholder="${T("搜索模型", "Search models")}"></label><label><span>${T("排序依据", "Sort by")}</span><select id="af-result-sort" class="cursor-interaction">${[
    ["memory", "显存余量优先", "More VRAM headroom"],
    ["large", "参数规模优先", "Larger parameter count"],
  ]
    .map(
      (o) =>
        `<option value="${o[0]}" ${state.resultSort === o[0] ? "selected" : ""}>${T(o[1], o[2])}</option>`,
    )
    .join(
      "",
    )}</select></label><button id="af-result-apply" type="button" class="cursor-interaction">${T("应用", "Apply")}</button></div><p class="af-sort-note">${sorting} ${T("容量估算不代表速度或运行时兼容性保证。", "Capacity estimates do not guarantee speed or runtime compatibility.")}</p><div class="af-short-table">${dataTable([T("模型 / 部署变体", "Model / deployment variant"), T("建议显存", "Required VRAM"), T("评估状态", "Assessment"), T("微调", "Fine-tuning"), T("详情", "Details")], rows, [38, 15, 20, 16, 11])}</div>${resultPager(items.length, pageCount)}<div class="af-comparebar"><span>${state.selected.length ? T("已选 ", "Selected ") + state.selected.length + T(" 个，可跨页选择", "; selections persist across pages") : T("勾选 2–3 个模型对比完整参数", "Select 2–3 models to compare full parameters")}</span><button type="button" data-work="compare" class="cursor-interaction" ${state.selected.length < 2 || state.selected.length > 3 ? "disabled" : ""}>${T("参数对比（2–3 个）", "Compare parameters (2–3)")} (${state.selected.length})</button></div>`;
}
function compactConfig() {
  return `<div class="af-configtop"><button type="button" data-work="results" class="af-rowbtn">← ${T("返回结果", "Back to results")}</button></div><div class="af-configgroups"><button type="button" data-config-group="0" aria-pressed="${state.configGroup === 0}">${T("设备选择", "Hardware selection")}</button><button type="button" data-config-group="1" aria-pressed="${state.configGroup === 1}">${T("模型与工作负载", "Model & workload")}</button></div>${state.configGroup === 0 ? fleetEditor() + group("微调选项", "Fine-tuning option", ["accelerator"]) : group("模型与工作负载", "Model & workload", ["cap", "quant", "context", "concurrency"])}<button type="button" data-work="results" class="af-primary">${T("查看更新后的结果", "View updated results")}</button>`;
}
function compactDetail() {
  const i = state.detailModel,
    m = catalog.M[i];
  return `<div class="af-configtop"><button type="button" data-work="results" class="af-rowbtn cursor-interaction">← ${T("返回第 ", "Back to page ")}${state.resultPage}${T(" 页结果", "")}</button><span>${T("返回后保留分组、排序、页码和对比选择", "Preserves grouping, sort, page and comparison selection")}</span></div><h3 class="af-detail-title">${esc(m[0])}</h3><div class="af-group af-detail">${modelDetail(m)}</div><div class="af-group af-detail"><h3>${T("当前设备与性能依据", "Current hardware & performance evidence")}</h3><div style="margin-top:12px">${deviceDetail(catalog.H[+state.values.device])}</div></div>`;
}
function hardware() {
  const header = workspaceHeader();
  if (state.workTab === "config") return header + compactConfig();
  if (state.workTab === "detail") return header + compactDetail();
  if (state.workTab === "compare") {
    state.compare = true;
    return (
      header +
      `<div class="af-configtop"><button type="button" data-work="results" class="af-rowbtn cursor-interaction">← ${T("返回候选列表", "Back to candidates")}</button><span>${T("只看选中的模型，完整参数并列对照", "Full parameters, selected models only")}</span></div>` +
      compared()
    );
  }
  return header + resultsView();
}

restore();
render();
const notifySize = () => {
  if (window.parent !== window)
    window.parent.postMessage(
      {
        type: "advisor-v2-height",
        height: Math.ceil(root.getBoundingClientRect().height),
      },
      location.origin,
    );
};
new ResizeObserver(notifySize).observe(root);
notifySize();

})();
</script>
  </body>
</html>
